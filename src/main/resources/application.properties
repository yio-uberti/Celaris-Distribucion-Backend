spring.application.name=BackendCelarisDis
server.servlet.context-path=/Api-Backend
server.port=8080

#LOCAL
# Conexi�n a la base de datos LOCAL (donde est�n los usuarios y sus tenants)
#spring.datasource.url=jdbc:mysql://localhost:3306/celaris
#spring.datasource.username=root
#spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.profiles.active=local

#Produccion
spring.datasource.url=${MYSQLHOST}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# Deshabilitar multi-tenancy temporalmente
spring.jpa.properties.hibernate.multiTenancy=NONE

# Configuraci�n JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuraci�n de zona horaria
spring.jackson.time-zone=America/Buenos_Aires
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# Logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO
logging.file.name=Spring.log
debug=false

# Logging de tu paquete/aplicaci�n (ajusta "com.tuempresa" a tu paquete)
logging.level.com.tuempresa=DEBUG
# Logging de Spring Web (para ver requests/responses HTTP)
logging.level.org.springframework.web=DEBUG
# Logging detallado de Spring MVC
logging.level.org.springframework.web.servlet.mvc=TRACE
# Logging de peticiones HTTP (incluye headers, body, status codes)
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
# Logging de filtros (tus mensajes de "OPTIONS detectado", etc)
logging.level.org.springframework.web.filter=DEBUG
# Logging de seguridad (si usas Spring Security)
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# Mostrar detalles completos de errores
